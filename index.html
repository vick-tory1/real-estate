<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Sign in | SamWealth Properties</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css" />
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css" />
  </head>
  <body>
    <script>window.location.replace('login.html');</script>
    <main class="section"><div class="container"><div class="row full-height justify-content-center"><div class="col-12 text-center align-self-center py-5"><div class="section pb-5 pt-5 pt-sm-2 text-center">
      <div class="card-3d-wrap mx-auto"><div class="card-3d-wrapper"><div class="card-front"><div class="center-wrap"><div class="section text-center">
        <h1 class="h4 mb-4 pb-3">Agent Login</h1><p><a href="signup.html">Create an account</a></p>
        <div data-auth-status hidden role="alert"></div>
        <form data-auth-form="login" novalidate>
          <div class="form-group"><label class="sr-only" for="email">Email</label><input type="email" id="email" name="email" placeholder="Your Email" class="form-style" autocomplete="email" required /><i class="input-icon uil uil-at"></i></div>
          <div class="form-group mt-2"><label class="sr-only" for="password">Password</label><input type="password" name="password" class="form-style" placeholder="Your Password" id="password" autocomplete="current-password" required /><i class="input-icon uil uil-lock-alt"></i></div>
          <button type="submit" class="btn mt-4">Submit</button><p class="mb-0 mt-4 text-center"><a href="forgetpass.html" class="link">Forgot your password?</a></p>
        </form>
      </div></div></div></div></div>
    </div></div></div></div></main><script src="auth.js"></script>
  </body>
</html>
