<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="dashboard.css"><title>Add listing | SamWealth</title></head><body><main class="dashboard-main"><a class="brand" href="agent_dashboard.html">SamWealth <span>Properties</span></a><section class="panel"><h1>Add a property listing</h1><form class="agent-form" data-property-form novalidate><label>Title<input name="title" maxlength="200" required></label><label>Property type<input name="type" maxlength="60" placeholder="Apartment, land, house…" required></label><label>For<select name="action" required><option value="SALE">Sale</option><option value="RENT">Rent</option></select></label><label>Price (NGN)<input name="price" type="number" min="0" max="1000000000000" step="0.01" required></label><label>Location<input name="location" maxlength="200" required></label><label>Description<textarea name="description" maxlength="5000" rows="6" required></textarea></label><button class="action" type="submit">Publish listing</button><p class="form-message" data-property-message role="status"></p></form><p><a href="feature.html">View my listings</a></p></section></main><script src="properties.js"></script></body></html>
